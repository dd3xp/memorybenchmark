[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memorybenchmark"
version = "0.4.0"
description = "A shared cartography game and graph-based memory evaluation prototype"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
include = ["memorybenchmark*"]

[tool.setuptools.package-data]
memorybenchmark = ["data/*.json", "static/*.html", "static/*.css", "static/*.js", "static/*.svg"]
