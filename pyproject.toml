[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memorybenchmark"
version = "0.5.0"
description = "A shared cartography game and graph-based memory evaluation prototype"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp==1.30.0"]

[project.scripts]
memorybenchmark-mcp = "memorybenchmark.mcp_server:main"
memorybenchmark-run = "memorybenchmark.experiment:main"

[tool.setuptools.packages.find]
include = ["memorybenchmark*"]

[tool.setuptools.package-data]
memorybenchmark = ["data/*.json", "static/*.html", "static/*.css", "static/*.js", "static/*.svg", "static/*.png"]
