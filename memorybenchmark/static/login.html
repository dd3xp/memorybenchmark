<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · 测绘手记</title>
<style>:root{font-family:"Microsoft YaHei",sans-serif;color:#3d2b1f;background:#fdf8f2}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background-image:radial-gradient(#8a706010 .5px,transparent .5px);background-size:5px 5px}main{width:min(100%,390px);padding:39px 35px;background:#fffaf5;border:1px solid #c9a87c60;border-radius:22px 8px 22px 8px}.mark{font:44px Georgia,serif;color:#8aaa7a}h1{font:500 27px SimSun,serif;letter-spacing:2px;margin:15px 0 32px}label{display:block;font-size:12px;color:#8a7060;margin-bottom:10px}input,button{width:100%;font:inherit;border-radius:8px}input{padding:13px;border:1px solid #c9a87c80;background:#fdf8f2;color:#3d2b1f;font-size:23px;letter-spacing:8px}button{margin-top:18px;padding:13px;border:1px solid #607a4e;background:#607a4e;color:#fdf8f2;border-radius:25px;cursor:pointer}button:hover{background:#4f6840}input:focus-visible,button:focus-visible{outline:2px solid #8aaa7a;outline-offset:3px}.error{color:#a85e67;font-size:12px;line-height:1.8;margin:12px 0 0}</style>
</head>
<body><main>
<span class="mark" aria-hidden="true">⌖</span><h1>测绘手记</h1>

<form method="post" action="/login" data-loading-submit>
<input type="hidden" name="next" value="{{NEXT}}">
<label for="pin">访问 PIN</label><input id="pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" autocomplete="current-password" required autofocus aria-describedby="login-error">
<p id="login-error" class="error" role="alert">{{MESSAGE}}</p>
<button type="submit">进入</button>
</form>

</main><script src="/ui-state.js"></script></body></html>
