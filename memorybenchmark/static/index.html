<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cartographer’s Notebook（测绘手记）</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header><div><span class="mark" aria-hidden="true">⌖</span><h1>测绘手记</h1></div><p>雾汀湖 · Easy<br><small>沿着湖岸探索，带着记录回到营地。</small></p><a class="quiet" href="/watch">观察 Agent</a><button id="fresh" class="quiet">重新开始</button></header>
<main>
  <section class="chart" aria-label="当前任务中已发现的地图">
    <div class="chart-title"><h2 id="sheet-title">雾汀湖勘测图</h2><span id="map-caption">尚未开始探索</span></div>
    <div class="map-toolbar"><label><input id="show-atlas" type="checkbox" checked> 累计点亮</label><div><button id="play-zoom-out" aria-label="缩小地图">−</button><span id="play-zoom-label">100%</span><button id="play-zoom-in" aria-label="放大地图">＋</button><button id="play-zoom-reset">全图</button></div></div>
    <svg id="map" viewBox="0 0 830 510" role="img" aria-label="已发现的地点与通路">
      <defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M 30 0 L 0 0 0 30" fill="none" stroke="#b2c9d6" stroke-width=".45"/></pattern></defs>
      <rect width="830" height="510" fill="url(#grid)"/><g id="edges"></g><g id="nodes"></g>
      <g class="compass" transform="translate(755 66)"><path d="M0 -21 L-7 8 L0 4 L7 8Z"/><text y="-31" text-anchor="middle">北</text></g>
    </svg>
    <div class="legend"><span><i class="current"></i>当前位置</span><span><i class="measured"></i>本次记录</span><span><i class="submitted"></i>已提交</span><span>△ 营地</span><span>放大可查看全部地名</span></div>
  </section>
  <aside>
    <section class="task"><span id="task-stage" class="section-label">雾汀湖 · Easy · 4 项委托</span><h2 id="task-name">坡口初测</h2><p id="instruction">从苇湾营地出发，记录北端坡口，再到岚丘营地提交。到达自动测绘，工具需要自行寻找取用。</p><ul id="objectives" class="objectives"></ul><p id="camp-status" class="camp-status"></p><button id="begin" class="primary">开始探索</button></section>
    <section id="play" hidden>
      <div class="status"><strong id="place"></strong><span id="conditions"></span></div>
      <div class="counts"><span id="time"></span><span id="distance"></span><span id="steps"></span></div>
      <div class="energy"><label for="energy">剩余体力 <strong id="stamina"></strong></label><meter id="energy" min="0" max="60" value="60"></meter></div>
      <h3>选择通路</h3><div id="routes"></div>
      <h3>随身工具</h3><p id="inventory" class="muted">无</p>
      <h3>此处可取用</h3><div id="stock"></div>
      <div class="tools"><button data-action="observe">观察周围</button><button data-action="wait">等待片刻</button><button data-action="submit">提交记录</button></div>
      <button id="abandon" class="quiet small">结束本次探索</button>
    </section>
    <section id="ending" hidden><h3 id="result"></h3><button id="next" class="primary">接下一个委托</button></section>
    <section class="journal"><h3>现场记录</h3><p id="empty-log">开始探索后，这里会记录你的操作反馈。</p><ol id="log" aria-live="polite"></ol></section>
    <p id="error" role="alert"></p>
  </aside>
</main>
<footer><span>雾汀湖 · 虚构地名与游戏规则</span><span>到达即记录，回营地提交后点亮</span><form method="post" action="/logout"><button class="quiet small" type="submit">退出登录</button></form></footer>
<script src="/maps.js"></script><script src="/app.js"></script>
</body></html>
